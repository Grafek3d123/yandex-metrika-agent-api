[project]
name = "yandex-metrika-agent-api"
version = "0.1.0"
description = "AI-friendly integration layer over the Yandex Metrica API (Management + Reports)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "cryptography>=42.0",
]

[project.scripts]
ymetrika = "yandex_metrika_agent.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yandex_metrika_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["yandex_metrika_agent", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RUF",
    "ANN",  # type annotations
    "T20",  # no print
    "S",    # bandit-ish security rules
]
ignore = [
    "ANN401",  # allow Any where httpx/json payloads need it
    "S101",    # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ANN001", "ANN201", "PLR2004"]
# BaseException — контракт CLI: именно его перехватывает main(), сужать нельзя.
"yandex_metrika_agent/__main__.py" = ["BLE001"]
# typing.* импортируются без кавычек: они нужны в рантайме для pydantic и TypeAdapter.
"yandex_metrika_agent/models/*.py" = ["TC003"]

[tool.ruff.lint.isort]
known-first-party = ["yandex_metrika_agent"]

# ---------------------------------------------------------------------------
# Настройки type-checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["yandex_metrika_agent", "tests"]
warn_unreachable = true
show_error_codes = true

# Тестам не нужны аннотации всего — они и так проверяются прогоном.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

# Внешние библиотеки без type stubs.
[[tool.mypy.overrides]]
module = ["respx.*", "pytest.*"]
ignore_missing_imports = true

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
